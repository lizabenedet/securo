# Suas imagens no lugar das oficiais.
#
# Use sempre junto com o compose de producao:
#   docker compose -f docker-compose.prod.yml -f docker-compose.custom.yml up -d
#
# Este arquivo nao existe no upstream de proposito: como e um arquivo novo,
# nada aqui gera conflito quando a branch `custom` e rebaseada sobre uma
# release nova. Se o upstream adicionar um servico que use a imagem do
# backend, lembre de espelha-lo aqui.
#
# SECURO_TAG fixa a versao (ex: v0.14.5-custom.1). Sem ele, usa :latest.
#
# TZ: sem isto o container roda em UTC e `date.today()` vira o dia seguinte as
# 21h de Brasilia — o fluxo de caixa perdia os dois primeiros dias do mes e o
# marcador de "hoje" pulava um dia toda noite. O `environment` daqui e mesclado
# com o `*backend-env` do docker-compose.prod.yml, chave a chave.

services:
  backend:
    image: ghcr.io/lizabenedet/securo-backend:${SECURO_TAG:-latest}
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

  celery-worker:
    image: ghcr.io/lizabenedet/securo-backend:${SECURO_TAG:-latest}
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

  celery-beat:
    image: ghcr.io/lizabenedet/securo-backend:${SECURO_TAG:-latest}
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

  mcp-server:
    image: ghcr.io/lizabenedet/securo-backend:${SECURO_TAG:-latest}
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

  frontend:
    image: ghcr.io/lizabenedet/securo-frontend:${SECURO_TAG:-latest}
    environment:
      # No docker-compose.prod.yml este valor e fixo em http://localhost:3000,
      # o que quebra links gerados na VPS. Defina FRONTEND_URL no .env de la.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
